<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Audit Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0D1B2A;
    --indigo: #1B3A6B;
    --electric: #2563EB;
    --electric-light: #EFF6FF;
    --slate: #64748B;
    --off-white: #F8FAFC;
    --white: #ffffff;
    --red: #DC2626;
    --red-bg: #FEF2F2;
    --amber: #D97706;
    --amber-bg: #FFFBEB;
    --green: #16A34A;
    --green-bg: #F0FDF4;
    --border: #E2E8F0;
    --light-bg: #F1F5F9;
    --cat-first: #7C3AED;
    --cat-msg: #0891B2;
    --cat-trust: #B45309;
    --cat-lead: #DC2626;
    --cat-mobile: #16A34A;
    --cat-visual: #DB2777;
    --cat-opps: #EA580C;
    --cat-seo: #2563EB;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--off-white);
    color: var(--navy);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.65;
  }

  /* ─── TOP NAV ─── */
  .topbar {
    background: var(--navy);
    padding: 0 2rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .topbar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .topbar-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--electric);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .topbar-name {
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topbar-url {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: #93C5FD;
  }
  .btn-download {
    background: var(--electric);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 7px 16px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
    text-decoration: none;
  }
  .btn-download:hover { background: #1d4ed8; }

  /* ─── HERO / COVER ─── */
  .cover {
    background: linear-gradient(160deg, var(--navy) 0%, #112040 60%, #0a1628 100%);
    padding: 4rem 2rem 3rem;
    position: relative;
    overflow: hidden;
  }
  .cover::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--electric);
  }
  .cover::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: rgba(255,255,255,0.06);
  }
  .cover-inner {
    max-width: 1000px;
    margin: 0 auto;
  }
  .cover-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #93C5FD;
    margin-bottom: 12px;
  }
  .cover-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 600;
    color: #fff;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .cover-url {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    color: #94A3B8;
    margin-bottom: 6px;
  }
  .cover-tagline {
    font-size: 14px;
    color: #93C5FD;
    margin-bottom: 2.5rem;
  }
  .cover-date {
    font-size: 12px;
    color: #64748B;
  }

  /* ─── SCORE GRID ─── */
  .score-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .score-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 1rem 0.75rem;
    text-align: center;
    transition: transform 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }
  .score-card:hover {
    background: rgba(255,255,255,0.08);
    transform: translateY(-2px);
  }
  .score-card.overall {
    background: var(--electric);
    border-color: transparent;
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 1.25rem 1.5rem;
  }
  .score-num {
    font-size: 2rem;
    font-weight: 600;
    line-height: 1;
  }
  .score-denom {
    font-size: 12px;
    opacity: 0.6;
    margin-top: 2px;
  }
  .score-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: 6px;
    opacity: 0.7;
  }
  .score-card .score-num { color: #fff; }
  .score-card .score-label { color: rgba(255,255,255,0.6); }
  .score-card.s-green .score-num { color: #4ade80; }
  .score-card.s-amber .score-num { color: #fbbf24; }
  .score-card.s-red .score-num { color: #f87171; }
  .overall-label {
    color: #fff;
    font-size: 14px;
    font-weight: 500;
  }
  .overall-num {
    font-size: 3.5rem;
    font-weight: 600;
    color: #fff;
    line-height: 1;
  }
  .overall-sub {
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    margin-top: 4px;
  }
  .ring-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
  }

  /* ─── MAIN LAYOUT ─── */
  .main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 2rem 2rem 4rem;
  }

  /* ─── SECTION HEADER ─── */
  .section-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 2.5rem 0 1rem;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--electric);
  }
  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--navy);
  }
  .section-count {
    font-size: 12px;
    color: var(--slate);
    font-weight: 500;
    background: var(--light-bg);
    padding: 2px 8px;
    border-radius: 20px;
  }

  /* ─── STAT BAR ─── */
  .stat-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 2rem;
    padding: 1.25rem;
    background: var(--electric-light);
    border: 1px solid #BFDBFE;
    border-radius: 12px;
  }
  .stat-cell {
    text-align: center;
  }
  .stat-num {
    font-size: 2rem;
    font-weight: 600;
    line-height: 1;
  }
  .stat-lbl {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--slate);
    margin-top: 4px;
  }
  .stat-cell.total .stat-num { color: var(--navy); }
  .stat-cell.high .stat-num  { color: var(--red); }
  .stat-cell.med .stat-num   { color: var(--amber); }
  .stat-cell.low .stat-num   { color: var(--green); }

  /* ─── CHECKLIST TABLE ─── */
  .checklist-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .checklist-table thead th {
    background: var(--indigo);
    color: #fff;
    padding: 10px 14px;
    text-align: left;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .checklist-table thead th:last-child { text-align: center; }
  .checklist-table thead th:nth-child(3) { text-align: center; }
  .cat-row td {
    padding: 8px 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
  }
  .check-row td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .check-row:last-child td { border-bottom: none; }
  .check-row.fail-row { background: #FEF2F2; }
  .check-row.pass-row:nth-child(even) { background: var(--off-white); }
  .check-num {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--slate);
    text-align: center;
  }
  .check-label { color: var(--navy); }
  .check-label.fail-label { color: var(--red); font-weight: 500; }
  .check-status {
    text-align: center;
    font-weight: 700;
    font-size: 12px;
  }
  .check-status.pass { color: var(--green); }
  .check-status.fail { color: var(--red); }
  .method-tag {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
  }
  .method-tag.ai   { background: #EDE9FE; color: #6D28D9; }
  .method-tag.html { background: #E0F2FE; color: #0369A1; }

  /* ─── NARRATIVE ─── */
  .narrative-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    line-height: 1.8;
    color: #334155;
    font-size: 15px;
  }
  .narrative-card p { margin-bottom: 1rem; }
  .narrative-card p:last-child { margin-bottom: 0; }

  /* ─── ISSUES BY CATEGORY ─── */
  .cat-section {
    margin-bottom: 2rem;
  }
  .cat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .cat-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cat-name {
    font-size: 1rem;
    font-weight: 600;
    color: var(--navy);
  }
  .cat-context {
    font-size: 13px;
    color: var(--slate);
    margin-bottom: 10px;
    padding: 10px 14px;
    background: var(--light-bg);
    border-left: 3px solid var(--border);
    border-radius: 0 6px 6px 0;
    line-height: 1.6;
  }
  .issue-table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    font-size: 13.5px;
  }
  .issue-table thead th {
    background: var(--indigo);
    color: #fff;
    padding: 9px 14px;
    text-align: left;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .issue-table tbody tr:nth-child(even) { background: var(--off-white); }
  .issue-table tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .issue-table tbody tr:last-child td { border-bottom: none; }
  .issue-title {
    font-weight: 600;
    color: var(--navy);
    margin-bottom: 3px;
    font-size: 13.5px;
  }
  .issue-desc {
    font-size: 12.5px;
    color: var(--slate);
    line-height: 1.55;
  }
  .sev-badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    letter-spacing: 0.04em;
  }
  .sev-badge.high   { background: var(--red-bg);   color: var(--red);   }
  .sev-badge.medium { background: var(--amber-bg);  color: var(--amber); }
  .sev-badge.low    { background: var(--green-bg);  color: var(--green); }

  /* ─── QUICK WINS ─── */
  .qw-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .qw-card {
    background: var(--electric-light);
    border: 1px solid #BFDBFE;
    border-radius: 12px;
    padding: 1.25rem;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .qw-num {
    font-family: 'Fraunces', serif;
    font-size: 2rem;
    font-weight: 600;
    color: var(--electric);
    line-height: 1;
    flex-shrink: 0;
    width: 28px;
  }
  .qw-text {
    font-size: 14px;
    color: var(--indigo);
    line-height: 1.55;
  }

  /* ─── WHAT NEXT ─── */
  .next-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    margin-top: 2rem;
  }
  .next-card p { margin-bottom: 0.75rem; color: #334155; font-size: 14px; line-height: 1.75; }
  .next-card p:last-child { margin-bottom: 0; }
  .callout {
    background: var(--electric-light);
    border-left: 3px solid var(--electric);
    padding: 10px 14px;
    border-radius: 0 8px 8px 0;
    font-size: 13px;
    color: var(--indigo);
    margin-top: 0.75rem;
    line-height: 1.6;
  }

  /* ─── PROGRESS BAR ─── */
  .progress-bar-wrap {
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 1s ease;
  }

  /* ─── URL INPUT FORM ─── */
  .input-section {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 2rem;
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .input-group {
    flex: 1;
    min-width: 240px;
  }
  .input-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--slate);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .url-input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: 'DM Mono', monospace;
    color: var(--navy);
    background: var(--off-white);
    transition: border-color 0.15s;
    outline: none;
  }
  .url-input:focus {
    border-color: var(--electric);
    background: #fff;
  }

  /* ─── LIVE LOG ─── */
  .log-panel {
    background: var(--navy);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
    font-family: 'DM Mono', monospace;
    font-size: 12.5px;
    color: #94A3B8;
    min-height: 180px;
    max-height: 300px;
    overflow-y: auto;
    line-height: 1.6;
    display: none;
  }
  .log-panel.visible { display: block; }
  .log-line { display: flex; gap: 10px; margin-bottom: 4px; animation: fadein 0.3s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
  .log-line .ts { color: #475569; flex-shrink: 0; }
  .log-line .msg { color: #CBD5E1; }
  .log-line .msg.ok     { color: #4ade80; }
  .log-line .msg.warn   { color: #fbbf24; }
  .log-line .msg.err    { color: #f87171; }
  .log-line .msg.info   { color: #93C5FD; }

  /* ─── REPORT WRAP (hidden until loaded) ─── */
  #report-area { display: none; }
  #report-area.visible { display: block; }

  /* ─── EMPTY STATE ─── */
  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--slate);
  }
  .empty-state .big-icon {
    font-size: 3rem;
    margin-bottom: 1rem;
    opacity: 0.3;
  }
  .empty-state p { font-size: 14px; }

  /* ─── TABS ─── */
  .tab-bar {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 1.5rem;
    overflow-x: auto;
  }
  .tab-btn {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    color: var(--slate);
    white-space: nowrap;
    transition: color 0.15s;
    font-family: 'DM Sans', sans-serif;
    margin-bottom: -1px;
  }
  .tab-btn.active {
    color: var(--electric);
    border-bottom-color: var(--electric);
    font-weight: 600;
  }
  .tab-btn:hover:not(.active) { color: var(--navy); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 640px) {
    .cover { padding: 2rem 1rem 2rem; }
    .main  { padding: 1rem 1rem 3rem; }
    .stat-bar { grid-template-columns: repeat(2, 1fr); }
    .score-card.overall { grid-column: auto; flex-direction: column; text-align: center; }
    .topbar-url { display: none; }
    .input-section { flex-direction: column; }
  }

  /* scrollbar */
  .log-panel::-webkit-scrollbar { width: 4px; }
  .log-panel::-webkit-scrollbar-track { background: transparent; }
  .log-panel::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
</style>
</head>
<body>

<!-- TOP NAV -->
<nav class="topbar">
  <div class="topbar-brand">
    <div class="topbar-dot"></div>
    <span class="topbar-name">Website Audit</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-url" id="nav-url"></span>
    <a href="#" class="btn-download" id="btn-pdf" style="display:none" onclick="alert('Connect your Python backend to enable PDF download.')">
      ↓ Download PDF
    </a>
  </div>
</nav>

<!-- MAIN WRAPPER -->
<div class="main" style="padding-top: 1.5rem;">

  <!-- URL INPUT CARD -->
  <div class="input-section">
    <div class="input-group">
      <div class="input-label">Website URL</div>
      <input class="url-input" id="url-input" type="url" placeholder="https://example.com" />
    </div>
    <div class="input-group" style="max-width: 200px;">
      <div class="input-label">Prospect name</div>
      <input class="url-input" id="prospect-input" type="text" placeholder="Acme Corp" />
    </div>
    <div class="input-group" style="max-width: 200px;">
      <div class="input-label">Your agency name</div>
      <input class="url-input" id="agency-input" type="text" placeholder="Your Agency" />
    </div>
    <button class="btn-download" id="run-btn" onclick="startAudit()" style="padding: 10px 22px; font-size: 14px; height: 40px; align-self: flex-end;">
      Run Audit ↗
    </button>
  </div>

  <!-- LIVE LOG -->
  <div class="log-panel" id="log-panel"></div>

  <!-- REPORT AREA -->
  <div id="report-area">
    <!-- filled dynamically -->
  </div>

  <!-- EMPTY STATE (shown until first audit) -->
  <div class="empty-state" id="empty-state">
    <div class="big-icon">🔍</div>
    <p>Enter a URL above and click <strong>Run Audit</strong> to generate a full 21-point website audit report.</p>
    <p style="margin-top:8px; font-size:13px; color:#94A3B8;">Checks SEO · Lead Gen · Trust · Mobile · Messaging · Visual Design</p>
  </div>

</div>

<script>

const CAT_COLORS = {
  "First Impression": "#7C3AED",
  "Messaging":        "#0891B2",
  "Trust":            "#B45309",
  "Lead Gen":         "#DC2626",
  "Mobile":           "#16A34A",
  "Visual Design":    "#DB2777",
  "Missed Opps":      "#EA580C",
  "SEO":              "#2563EB"
};

const SCORE_LABELS = {
  first_impression: "First Impression",
  messaging:        "Messaging",
  lead_gen:         "Lead Gen",
  trust:            "Trust",
  seo:              "SEO",
  mobile:           "Mobile",
  visual_design:    "Visual Design",
  missed_opps:      "Missed Opps",
  overall:          "Overall"
};

const CAT_CONTEXTS = {
  "First Impression": "A visitor decides whether to stay or leave within 5 seconds. First impression issues directly reduce the number of prospects who even read the offer.",
  "Messaging": "Messaging determines whether visitors feel understood and motivated to act. Benefit-driven copy that speaks to pain points consistently outperforms service lists.",
  "Trust": "Trust signals are the primary reason a qualified visitor either converts or leaves to check competitors. Social proof, real people, and proof of results are non-negotiable.",
  "Lead Gen": "Lead generation issues directly translate to lost enquiries. Every friction point — missing CTAs, broken forms, hidden contact details — reduces the enquiries you receive.",
  "Mobile": "Over 60% of web traffic is now on mobile devices. Mobile experience issues also reduce Google search rankings, cutting the flow of new visitors.",
  "Visual Design": "Visual design is the silent salesperson. A design that doesn't reflect the quality of the business undermines all other marketing efforts.",
  "Missed Opps": "These represent easy wins not yet being captured. Retargeting pixels, content marketing, and social proof are high-ROI levers that cost little to implement.",
  "SEO": "SEO issues reduce visibility in search results, limiting the number of qualified prospects who discover the business organically."
};

// ─────────────────────────────────────────────────────────────────────────────
// RENDER ENGINE
// ─────────────────────────────────────────────────────────────────────────────

function scoreClass(s) {
  if (s >= 75) return 's-green';
  if (s >= 50) return 's-amber';
  return 's-red';
}

function renderCover(data) {
  const s = data.scores;
  const buckets = ['first_impression','messaging','lead_gen','trust','seo','mobile','visual_design','missed_opps'];

  const cards = buckets.map(k => {
    const v = s[k];
    const cls = scoreClass(v);
    const bar = Math.round(v);
    return `<div class="score-card ${cls}">
      <div class="score-num">${v}</div>
      <div class="score-denom">/ 100</div>
      <div class="score-label">${SCORE_LABELS[k]}</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${bar}%;background:${v>=75?'#4ade80':v>=50?'#fbbf24':'#f87171'}"></div></div>
    </div>`;
  }).join('');

  return `
  <div class="cover">
    <div class="cover-inner">
      <div class="cover-label">Website Audit Report — 21-Point Conversion Audit</div>
      <div class="cover-title">${escHtml(data.prospect)}</div>
      <div class="cover-url">${escHtml(data.url)}</div>
      <div class="cover-tagline">Comprehensive 21-Point Conversion Audit</div>

      <div class="score-grid" style="margin-bottom:1rem">
        <div class="score-card overall">
          <div>
            <div class="overall-num">${s.overall}</div>
            <div class="overall-sub">/ 100 overall</div>
          </div>
          <div style="flex:1;padding-left:1.5rem">
            <div class="overall-label" style="font-size:1.1rem;font-weight:600;margin-bottom:4px">Overall Score</div>
            <div style="font-size:13px;color:rgba(255,255,255,0.65);line-height:1.5">
              ${s.overall >= 75 ? 'Strong foundation — targeted improvements will unlock growth.' :
                s.overall >= 50 ? 'Significant revenue is being left on the table. Key fixes are straightforward.' :
                'The site is actively hindering the business. Prioritised action is needed.'}
            </div>
          </div>
        </div>
        ${cards}
      </div>

      <div class="cover-date">Prepared ${data.date}</div>
    </div>
  </div>`;
}

function renderStatBar(issues) {
  const high   = issues.filter(i => i.severity === 'HIGH').length;
  const medium = issues.filter(i => i.severity === 'MEDIUM').length;
  const low    = issues.filter(i => i.severity === 'LOW').length;
  return `<div class="stat-bar">
    <div class="stat-cell total"><div class="stat-num">${issues.length}</div><div class="stat-lbl">Total Issues</div></div>
    <div class="stat-cell high"><div class="stat-num">${high}</div><div class="stat-lbl">High Priority</div></div>
    <div class="stat-cell med"><div class="stat-num">${medium}</div><div class="stat-lbl">Medium</div></div>
    <div class="stat-cell low"><div class="stat-num">${low}</div><div class="stat-lbl">Low</div></div>
  </div>`;
}

function renderChecklist(checklist) {
  let prevCat = null;
  let rows = '';
  for (const item of checklist) {
    if (item.cat !== prevCat) {
      const col = CAT_COLORS[item.cat] || '#1B3A6B';
      rows += `<tr class="cat-row"><td colspan="4" style="background:${col}">${escHtml(item.cat.toUpperCase())}</td></tr>`;
      prevCat = item.cat;
    }
    const isFail = item.status === 'fail';
    rows += `<tr class="${isFail ? 'fail-row' : 'pass-row'} check-row">
      <td class="check-num">${item.num}</td>
      <td class="check-label ${isFail ? 'fail-label' : ''}">${escHtml(item.label)}</td>
      <td class="check-status ${item.status === 'pass' ? 'pass' : 'fail'}">${item.status === 'pass' ? '✓ PASS' : '✗ FAIL'}</td>
      <td style="text-align:center"><span class="method-tag ${item.method.toLowerCase()}">${item.method}</span></td>
    </tr>`;
  }
  return `<table class="checklist-table">
    <thead><tr>
      <th style="width:40px">#</th>
      <th>Check</th>
      <th style="text-align:center;width:80px">Status</th>
      <th style="text-align:center;width:70px">Method</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function renderIssues(issues) {
  // Group by category
  const grouped = {};
  for (const iss of issues) {
    if (!grouped[iss.category]) grouped[iss.category] = [];
    grouped[iss.category].push(iss);
  }
  const catOrder = ["First Impression","Messaging","Lead Gen","Trust","Mobile","SEO","Missed Opps","Visual Design"];
  const orderedCats = [...catOrder.filter(c => grouped[c]), ...Object.keys(grouped).filter(c => !catOrder.includes(c))];

  return orderedCats.map(cat => {
    const items = grouped[cat].sort((a,b) => ({HIGH:0,MEDIUM:1,LOW:2}[a.severity]-({HIGH:0,MEDIUM:1,LOW:2}[b.severity])));
    const col = CAT_COLORS[cat] || '#1B3A6B';
    const ctx = CAT_CONTEXTS[cat] || '';
    const rows = items.map(iss => `
      <tr>
        <td>
          <div class="issue-title">${escHtml(iss.title)}</div>
          <div class="issue-desc">${escHtml(iss.description)}</div>
        </td>
        <td style="width:90px;text-align:right;vertical-align:top;padding-top:11px">
          <span class="sev-badge ${iss.severity.toLowerCase()}">${iss.severity}</span>
        </td>
      </tr>`).join('');

    return `<div class="cat-section">
      <div class="cat-header">
        <div class="cat-dot" style="background:${col}"></div>
        <div class="cat-name" style="color:${col}">${escHtml(cat)}</div>
        <span class="section-count">${items.length} issue${items.length !== 1 ? 's' : ''}</span>
      </div>
      ${ctx ? `<div class="cat-context">${escHtml(ctx)}</div>` : ''}
      <table class="issue-table">
        <thead><tr><th>Issue</th><th style="text-align:right;width:90px">Priority</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }).join('');
}

function renderQuickWins(wins) {
  return wins.map((w, i) => `
    <div class="qw-card">
      <div class="qw-num">${i+1}</div>
      <div class="qw-text">${escHtml(w)}</div>
    </div>`).join('');
}

function renderReport(data) {
  const failCount = data.checklist.filter(c => c.status === 'fail').length;
  const passCount = data.checklist.filter(c => c.status === 'pass').length;

  return `
  ${renderCover(data)}
  <div class="main">

    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab(this,'tab-summary')">Executive Summary</button>
      <button class="tab-btn" onclick="switchTab(this,'tab-checklist')">21-Check Audit (${failCount} fails)</button>
      <button class="tab-btn" onclick="switchTab(this,'tab-issues')">Detailed Findings (${data.issues.length})</button>
      <button class="tab-btn" onclick="switchTab(this,'tab-wins')">Quick Wins</button>
    </div>

    <!-- TAB: SUMMARY -->
    <div id="tab-summary" class="tab-panel active">
      <div class="section-header">
        <div class="section-title">Executive Summary</div>
      </div>
      ${renderStatBar(data.issues)}
      <div class="narrative-card">${data.narrative.split('\n\n').filter(Boolean).map(p => `<p>${escHtml(p)}</p>`).join('')}</div>
    </div>

    <!-- TAB: CHECKLIST -->
    <div id="tab-checklist" class="tab-panel">
      <div class="section-header">
        <div class="section-title">21-Point Audit Checklist</div>
        <span class="section-count">${passCount} pass · ${failCount} fail</span>
      </div>
      <p style="font-size:13px;color:var(--slate);margin-bottom:1rem">Every website is assessed against the same 21 checks across 8 categories. HTML checks are detected automatically from page code; AI checks are assessed by a language model reviewing content, copy, and visual design.</p>
      ${renderChecklist(data.checklist)}
    </div>

    <!-- TAB: ISSUES -->
    <div id="tab-issues" class="tab-panel">
      <div class="section-header">
        <div class="section-title">Detailed Findings</div>
        <span class="section-count">${data.issues.length} issues</span>
      </div>
      ${renderIssues(data.issues)}
    </div>

    <!-- TAB: QUICK WINS -->
    <div id="tab-wins" class="tab-panel">
      <div class="section-header">
        <div class="section-title">Quick Wins This Week</div>
      </div>
      <p style="font-size:13px;color:var(--slate);margin-bottom:1.25rem">Three high-impact, low-effort improvements that can be actioned immediately without a full website rebuild — each one has a direct impact on leads and revenue.</p>
      <div class="qw-grid">${renderQuickWins(data.quick_wins)}</div>

      <div class="next-card">
        <p style="font-weight:600;color:var(--navy);margin-bottom:0.75rem;font-size:15px">What Happens Next?</p>
        <p>This audit is a starting point, not an end point. Every issue identified here has a clear solution, and most can be addressed without a full website rebuild. The quick wins above are designed to have an immediate impact — each one removes friction from the path between a prospect and an enquiry.</p>
        <p>The highest-priority improvements are those in the Lead Generation and Trust categories. Fixing these directly increases the percentage of visitors who convert into enquiries, which means more revenue from the same traffic.</p>
        <div class="callout">Prioritisation framework: address HIGH severity issues first, then MEDIUM. LOW severity issues are refinements — they matter, but they will not move the needle the way the higher-priority fixes will.</div>
      </div>
    </div>

  </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// AUDIT RUNNER (DEMO — swap with real fetch() to your Python backend)
// ─────────────────────────────────────────────────────────────────────────────

async function startAudit() {
  const urlVal      = document.getElementById('url-input').value.trim();
  const prospectVal = document.getElementById('prospect-input').value.trim();
  const agencyVal   = document.getElementById('agency-input')?.value.trim() || 'Your Agency';

  if (!urlVal) { alert('Please enter a URL.'); return; }

  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('report-area').className = '';
  document.getElementById('report-area').innerHTML = '';

  const logPanel = document.getElementById('log-panel');
  logPanel.className = 'log-panel visible';
  logPanel.innerHTML = '';

  document.getElementById('nav-url').textContent = urlVal.replace(/^https?:\/\//, '');

  function log(msg, cls = 'info') {
    const now = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    logPanel.innerHTML += `<div class="log-line"><span class="ts">${now}</span><span class="msg ${cls}">${msg}</span></div>`;
    logPanel.scrollTop = logPanel.scrollHeight;
  }

  log('Starting audit…');
  log(`Target: ${urlVal}`, 'info');

  // Show a progress message while the real backend runs (takes 15-30s)
  const spinnerInterval = setInterval(() => {
    const dots = ['Crawling pages…', 'Running HTML checks…', 'Capturing screenshot…', 'Running AI analysis…', 'Calculating scores…'];
    log(dots[Math.floor(Math.random() * dots.length)], 'info');
  }, 4000);

  try {
    const response = await fetch('/api/audit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: urlVal, prospect: prospectVal, agency: agencyVal })
    });

    clearInterval(spinnerInterval);

    if (!response.ok) {
      const err = await response.json();
      log(`Error: ${err.error}`, 'err');
      return;
    }

    const data = await response.json();
    log('✓ Audit complete — rendering report.', 'ok');

    await sleep(400);
    logPanel.className = 'log-panel'; // hide log

    const reportArea = document.getElementById('report-area');
    reportArea.innerHTML = renderReport(data);
    reportArea.className = 'visible';

    // Wire up PDF download if backend generated one
    const pdfBtn = document.getElementById('btn-pdf');
    if (data.pdf_file) {
      pdfBtn.href   = `/download/${data.pdf_file}`;
      pdfBtn.style.display = 'flex';
      pdfBtn.onclick = null; // remove the alert() onclick
    }

    document.querySelector('.cover')?.scrollIntoView({ behavior: 'smooth' });

  } catch (err) {
    clearInterval(spinnerInterval);
    log(`Network error: ${err.message}`, 'err');
  }
}
// ─── HELPERS ───
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function escHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function switchTab(btn, id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(id).classList.add('active');
}

// Enter key to run audit
document.getElementById('url-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') startAudit();
});
</script>
